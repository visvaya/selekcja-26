version: 2

# Weekly, grouped updates keep the PR count low on a single-maintainer repo.
# Security updates are not grouped here: they arrive on their own as soon as
# an advisory lands, independent of this schedule. `cooldown` waits a week
# after a version is published before proposing it.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    commit-message:
      prefix: build
      prefix-development: build
      include: scope
    groups:
      production-minor-patch:
        dependency-type: production
        update-types: [minor, patch]
      development-minor-patch:
        dependency-type: development
        update-types: [minor, patch]
  # Workflows pin actions to commit SHAs with the exact release as a comment
  # (`@<sha> # v7.0.1`); Dependabot bumps the SHA and rewrites the comment
  # when it names the most specific tag of the pinned commit.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
