name: Secrets

# gitleaks checks the whole git history: called by CI on every push to main and pull request,
# and weekly on its own. It adds generic patterns on top of GitHub's own secret scanning, which
# matches known provider token formats.
on:
  workflow_call:
  schedule:
    - cron: "0 5 * * 1" # Monday 05:00 UTC
  workflow_dispatch:

permissions:
  contents: read

# Inside a CI call github.event_name is the caller's event, so a CI run never waits for, or
# cancels, a scheduled scan.
concurrency:
  group: secrets-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history, not only the pushed commit
          persist-credentials: false
      # Pinned by hand with its checksum from the release's checksums.txt: Dependabot does not
      # bump a binary downloaded in a run step (tool-freshness.yml reports new releases).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  ${archive}" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
      - name: Scan the full history for secrets
        run: '"$RUNNER_TEMP/gitleaks" git . --redact --no-banner'
