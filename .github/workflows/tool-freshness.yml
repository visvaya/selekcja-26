name: Tool freshness

# Dependabot does not see tools pinned by version and checksum in workflow env, so this compares
# each of them every week with its newest stable release that is at least 3 days old (the
# release-age rule) and fails when the pin differs.
on:
  schedule:
    - cron: "17 6 * * 1" # Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tool-freshness
  cancel-in-progress: true

jobs:
  pinned-tools:
    name: pinned-tools
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows
      - name: Hand-pinned tools are on their latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          cutoff=$(date -u -d "3 days ago" +%Y-%m-%dT%H:%M:%SZ)
          check() {
            local variable=$1 repository=$2 file=$3 pinned due
            pinned=$(sed -n "s/^ *${variable}: *//p" "$file" | head -n 1)
            if ! due=$(gh release list --repo "$repository" --exclude-pre-releases --exclude-drafts \
              --limit 30 --json tagName,publishedAt \
              --jq "[.[] | select(.publishedAt <= \"$cutoff\")] | sort_by(.publishedAt) | last | .tagName // empty") ||
              [ -z "$due" ]; then
              echo "::error::Could not read the releases of $repository."
              exit 2
            fi
            due=${due#v}
            if [ "$pinned" = "$due" ]; then
              echo "$variable $pinned is the newest release at least 3 days old."
            else
              echo "::error file=$file::$variable is '$pinned', the newest release of $repository at least 3 days old is $due; update it and its checksum."
              status=1
            fi
          }
          check GITLEAKS_VERSION gitleaks/gitleaks .github/workflows/secrets.yml
          check ACTIONLINT_VERSION rhysd/actionlint .github/workflows/ci.yml
          check ZIZMOR_VERSION zizmorcore/zizmor .github/workflows/ci.yml
          exit "$status"
