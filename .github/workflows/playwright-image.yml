name: Playwright image

# Reads the image the browser jobs run in from .github/playwright/Dockerfile, the one place
# Dependabot updates it (together with @playwright/test), and hands it to the calling workflow.
on:
  workflow_call:
    outputs:
      image:
        description: Digest-pinned Playwright image reference
        value: ${{ jobs.read.outputs.image }}

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      image: ${{ steps.read.outputs.image }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/playwright
      - id: read
        run: |
          image="$(sed -n 's/^FROM //p' .github/playwright/Dockerfile)"
          if ! printf '%s' "$image" | grep -Eq '^mcr\.microsoft\.com/playwright:v[0-9]+\.[0-9]+\.[0-9]+-noble@sha256:[0-9a-f]{64}$'; then
            echo "::error file=.github/playwright/Dockerfile::Expected one digest-pinned Playwright image, got: $image"
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"
