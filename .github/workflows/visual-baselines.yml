name: Visual baselines

# Regenerates the Linux screenshot baselines and uploads them as an artifact to commit.
# Runs when a pull request gets the "update-screenshots" label, or by hand.
on:
  pull_request:
    types: [labeled]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  baselines:
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'update-screenshots'
    # Same image as ci.yml, so baselines render with the fonts the journeys see.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
      options: --user 1001
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Font diagnostics (temporary)
        run: |
          export FONTCONFIG_FILE="$PWD/e2e/fonts.conf"
          for f in sans-serif "sans-serif:bold" sans system-ui Inter Arial; do echo "$f -> $(fc-match "$f")"; done
          fc-list : family file
      - name: Regenerate baselines
        env:
          CI: "1"
          UPDATE_SCREENSHOTS: "1"
        run: pnpm exec playwright test --project=visual --update-snapshots=all
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: visual-baselines
          path: e2e/screenshots/
          retention-days: 7
