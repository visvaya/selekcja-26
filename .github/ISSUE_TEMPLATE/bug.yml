name: Bug report
description: Something in the game does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start a new game with the 4-3-3 formation
        2. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Game version
      description: Shown in the top bar of the game.
  - type: input
    id: device
    attributes:
      label: Device and browser
      placeholder: e.g. iPhone 15, Safari 26
    validations:
      required: true
