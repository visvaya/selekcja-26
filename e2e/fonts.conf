<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Linux only (playwright.config.ts passes it as FONTCONFIG_FILE). The Playwright CI image maps
  sans-serif and system-ui to WenQuanYi Zen Hei, which has no bold face and no Polish letters,
  so screenshots lost their bold text. This file replaces the system configuration and exposes
  only faces with bold weights and Polish letters, so every family the browser asks for, generic
  or unknown, resolves the same way on every run.
-->
<fontconfig>
  <dir>/usr/share/fonts/truetype/liberation</dir>
  <dir>/usr/share/fonts/truetype/freefont</dir>
  <dir>/usr/share/fonts/truetype/noto</dir>
  <cachedir>/tmp/selekcja-26-fontconfig</cachedir>
  <alias binding="same">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="same">
    <family>serif</family>
    <prefer><family>Liberation Serif</family></prefer>
  </alias>
  <alias binding="same">
    <family>monospace</family>
    <prefer><family>Liberation Mono</family></prefer>
  </alias>
  <alias binding="same">
    <family>emoji</family>
    <prefer><family>Noto Color Emoji</family></prefer>
  </alias>
  <!-- Any other family that is not installed falls back to Liberation Sans. -->
  <match target="pattern">
    <edit name="family" mode="append_last">
      <string>Liberation Sans</string>
    </edit>
  </match>
</fontconfig>
