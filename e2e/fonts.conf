<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Linux only (playwright.config.ts passes it as FONTCONFIG_FILE). The Playwright CI image maps
  sans-serif to WenQuanYi Zen Hei, which has no bold face and no Polish letters, so screenshots
  lost their bold text. Faces without a bold weight are rejected, which leaves Liberation Sans
  (preferred) and FreeSans, both with bold and Polish letters, whichever name the browser asks for.
-->
<fontconfig>
  <selectfont>
    <rejectfont>
      <glob>*/wqy*</glob>
      <glob>*/ipa*</glob>
      <glob>*/unifont*</glob>
      <glob>*/Unifont*</glob>
    </rejectfont>
  </selectfont>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
