<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!--
  Linux only (playwright.config.ts passes it as FONTCONFIG_FILE). The Playwright CI image maps
  sans-serif to WenQuanYi Zen Hei, which has no bold face and no Polish letters. Liberation Sans,
  also in the image, has both. The aliases come before the system configuration so they win.
-->
<fontconfig>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>Liberation Sans</family></prefer>
  </alias>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
</fontconfig>
